<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header"></div>
    <main>
        <section>
            <h2>Submit Your Solution</h2>
            <p>Submit your solver results for an existing benchmark. Follow the <a href="user_guide.html">User Guide</a> for detailed instructions.</p>
            <form id="submission-form">
                <label for="solution-category">Benchmark Category:</label>
                <select id="solution-category" name="solution-category" onchange="loadBenchmarkNames()">
                    <option value="">-- Select Category --</option>
                    <option value="HJB">HJB (Hamilton-Jacobi-Bellman)</option>
                    <option value="OT">OT (Optimal Transport)</option>
                    <option value="OC">OC (Optimal Control)</option>
                    <option value="SOC">SOC (Stochastic Optimal Control)</option>
                    <option value="WGF">WGF (Wasserstein Gradient Flow)</option>
                </select>

                <label for="solution-benchmark">Benchmark:</label>
                <select id="solution-benchmark" name="solution-benchmark">
                    <option value="">-- Select Category First --</option>
                </select>

                <label for="submission-type">Submission Type:</label>
                <select id="submission-type" name="submission-type" onchange="toggleSubmissionFields()">
                    <option value="results">Results (CSV)</option>
                    <option value="github">GitHub Link</option>
                    <option value="code">Code Files (ZIP)</option>
                </select>

                <div id="results-field" class="submission-field">
                    <label for="results-file">Upload Results (CSV):</label>
                    <input type="file" id="results-file" name="results-file" accept=".csv">
                </div>

                <div id="solution-github-field" class="submission-field" style="display: none;">
                    <label for="solution-github-link">GitHub Repository Link:</label>
                    <input type="url" id="solution-github-link" name="solution-github-link" placeholder="https://github.com/your-repo">
                </div>

                <div id="code-field" class="submission-field" style="display: none;">
                    <label for="code-files">Upload Code Files (ZIP):</label>
                    <input type="file" id="code-files" name="code-files" accept=".zip">
                </div>

                <button type="submit">Submit Solution</button>
            </form>

            <h2>Submit a New Benchmark</h2>
            <p>Propose a new benchmark problem for inclusion in the platform.</p>
            <form id="benchmark-form">
                <label for="benchmark-category">Category:</label>
                <select id="benchmark-category" name="benchmark-category" required>
                    <option value="">-- Select Category --</option>
                    <option value="HJB">HJB (Hamilton-Jacobi-Bellman)</option>
                    <option value="OT">OT (Optimal Transport)</option>
                    <option value="OC">OC (Optimal Control)</option>
                    <option value="SOC">SOC (Stochastic Optimal Control)</option>
                    <option value="WGF">WGF (Wasserstein Gradient Flow)</option>
                </select>

                <label for="benchmark-name">Benchmark Name:</label>
                <input type="text" id="benchmark-name" name="benchmark-name" placeholder="Enter benchmark name" required>

                <label for="benchmark-description">Description:</label>
                <textarea id="benchmark-description" name="benchmark-description" placeholder="Enter benchmark description" rows="4" required></textarea>

                <label for="benchmark-type">Submission Type:</label>
                <select id="benchmark-type" name="benchmark-type" onchange="toggleBenchmarkFields()">
                    <option value="github">GitHub Link</option>
                    <option value="file">Upload Files (ZIP)</option>
                </select>

                <div id="benchmark-github-field" class="benchmark-field">
                    <label for="benchmark-github-link">GitHub Repository Link:</label>
                    <input type="url" id="benchmark-github-link" name="benchmark-github-link" placeholder="https://github.com/your-repo">
                </div>

                <div id="benchmark-file-field" class="benchmark-field" style="display: none;">
                    <label for="benchmark-files">Upload Files (ZIP):</label>
                    <input type="file" id="benchmark-files" name="benchmark-files" accept=".zip">
                </div>

                <button type="submit">Submit Benchmark</button>
            </form>
        </section>
    </main>
    <div id="footer"></div>
    <script src="scripts/main.js"></script>
    <script src="scripts/submission.js"></script>
</body>
</html>
