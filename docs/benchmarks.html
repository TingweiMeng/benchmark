<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmarks - HJB PDE Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header"></div>
    <main class="benchmarks-layout">
        <aside class="sidebar">
            <h3>Categories</h3>
            <div id="categories-list">
                <!-- Categories will be dynamically loaded -->
                <div id="categories-loading">Loading categories...</div>
            </div>
        </aside>
        <section class="content">
            <h2>Available Benchmarks</h2>
            <p><strong>New to benchmarks?</strong> Visit the <a href="user_guide.html">User Guide</a> for detailed instructions on how to download, implement, and test your solutions.</p>
            
            <!-- Benchmark Summary (dynamically populated) -->
            <div id="benchmark-summary" style="display: none;">
                <div class="summary-stats">
                    <span class="stat" id="total-categories">0 Categories</span>
                    <span class="stat" id="total-benchmarks">0 Benchmarks</span>
                    <span class="stat" id="total-test-cases">0 Test Cases</span>
                </div>
                <p class="last-updated" id="last-updated"></p>
            </div>
            
            <!-- Problems List (dynamically populated) -->
            <div id="problems-list">
                <div id="benchmarks-loading">Loading benchmarks...</div>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="scripts/main.js"></script>
    <script src="scripts/benchmarks.js"></script>
</body>
</html>
