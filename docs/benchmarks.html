<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmarks - HJ PDE Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header"></div>
    <main class="benchmarks-layout">
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul>
                <li><button onclick="showProblems('hj_pde')">HJ PDE</button></li>
                <li><button onclick="showProblems('optimal_control')">Optimal Control</button></li>
                <li><button onclick="showProblems('optimal_transport')">Optimal Transport</button></li>
                <li><button onclick="showProblems('mean_field')">Mean Field Control</button></li>
            </ul>
        </aside>
        <section class="content">
            <h2>Available Benchmarks</h2>
            <p><strong>New to benchmarks?</strong> Visit the <a href="user_guide.html">User Guide</a> for detailed instructions on how to download, implement, and test your solutions.</p>
            
            <div id="problems-list">
                <p>Select a category from the sidebar to view available benchmarks.</p>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="scripts/main.js"></script>
    <script src="scripts/benchmarks.js"></script>
</body>
</html>
